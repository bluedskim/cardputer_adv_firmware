name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build M5Launcher binary
        run: pio run -e m5launcher

      - name: Build Companion APK
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Stage versioned release assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          mkdir -p dist
          test -f dist/cardputer_adv_firmware.bin
          test -f companion/app/build/outputs/apk/release/app-release.apk
          cp -f dist/cardputer_adv_firmware.bin \
            "dist/cardputer_adv_firmware-${VER}.bin"
          cp -f companion/app/build/outputs/apk/release/app-release.apk \
            "dist/CardputerCompanion-${VER}.apk"
          ls -la "dist/cardputer_adv_firmware-${VER}.bin" \
            "dist/CardputerCompanion-${VER}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          NOTES_FILE=".github/RELEASE_NOTES/${TAG}.md"
          ASSETS=(
            "dist/cardputer_adv_firmware-${VER}.bin"
            "dist/CardputerCompanion-${VER}.apk"
          )
          for f in "${ASSETS[@]}"; do
            test -f "$f" || { echo "missing asset: $f"; exit 1; }
          done

          # Draft releases do not show as "Latest" on the repo home page.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — publish + upload assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            EDIT_ARGS=(--draft=false --latest)
            if [ -f "$NOTES_FILE" ]; then
              EDIT_ARGS+=(--notes-file "$NOTES_FILE")
              TITLE=$(head -n1 "$NOTES_FILE" | sed 's/^#* *//')
              if [ -n "$TITLE" ]; then
                EDIT_ARGS+=(--title "$TITLE")
              fi
            fi
            gh release edit "$TAG" "${EDIT_ARGS[@]}"
          else
            CREATE_ARGS=(--latest)
            if [ -f "$NOTES_FILE" ]; then
              TITLE=$(head -n1 "$NOTES_FILE" | sed 's/^#* *//')
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "${TITLE:-$TAG}" \
                --notes-file "$NOTES_FILE" \
                "${CREATE_ARGS[@]}"
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "$TAG" \
                --generate-notes \
                "${CREATE_ARGS[@]}"
            fi
          fi
