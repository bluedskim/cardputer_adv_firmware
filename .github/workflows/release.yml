name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build M5Launcher binary
        run: pio run -e m5launcher

      - name: Build Companion APK
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk \
            ../dist/CardputerCompanion.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE=".github/RELEASE_NOTES/${TAG}.md"
          ASSETS=(
            dist/cardputer_adv_firmware.bin
            dist/CardputerCompanion.apk
          )
          for f in "${ASSETS[@]}"; do
            test -f "$f" || { echo "missing asset: $f"; exit 1; }
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "$TAG" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" "${ASSETS[@]}" \
                --title "$TAG" \
                --generate-notes
            fi
          fi
