[platformio]
default_envs = m5launcher

[env:m5stack-cardputer]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = huge_app.csv
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_M5STACK_CARDPUTER
    -std=gnu++17
lib_deps =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    z3t0/IRremote@^4.4.1

[env:m5launcher]
extends = env:m5stack-cardputer
board_build.partitions = default_8MB.csv
extra_scripts = post:scripts/export_launcher_bin.py

[env:sim]
platform = native
build_type = debug
build_flags =
  -std=c++17
  -DCARDPUTER_SIM
  -DM5GFX_SCALE=3
  -DM5GFX_BOARD=board_M5Cardputer
  -DM5GFX_ROTATION=0
  -DM5GFX_SHOW_FRAME
  -DM5GFX_BACK_COLOR=0x222222
  -I${PROJECT_DIR}/sim/include
  -I${PROJECT_DIR}/include
  !pkg-config --cflags sdl2
  !pkg-config --libs sdl2
lib_deps =
  m5stack/M5GFX@^0.2.8
build_src_filter =
  +<*>
  +<../sim/src>
  -<main.cpp>
  -<launcher_exit.cpp>
