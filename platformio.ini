[platformio]
default_envs = m5launcher

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_M5STACK_CARDPUTER
    -std=gnu++17
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    z3t0/IRremote@^4.4.1

; USB 직접 플래시용 (단독 펌웨어)
[env:m5stack-cardputer]
board_build.partitions = huge_app.csv

; M5Launcher OTA 앱 슬롯 설치용
[env:m5launcher]
board_build.partitions = default_8MB.csv
extra_scripts = post:scripts/export_launcher_bin.py
